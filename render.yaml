services:
  - type: web
    name: hoovale
    runtime: python
    rootDir: hoovale_project
    buildCommand: bash render-build.sh
    startCommand: python manage.py migrate --noinput && gunicorn hoovale.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DATABASE_URL
        fromDatabase:
          name: hoovale_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      # Admin account
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "hoovale@outlook.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_USERNAME
        value: "admin"
      - key: ADMIN_RESET_PHONE
        sync: false

      # Free transactional email via Brevo
      - key: OTP_EMAIL_PROVIDER
        value: "brevo"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "HOOVALE"

      # SMS OTP via Twilio Verify
      - key: OTP_SMS_PROVIDER
        value: "twilio"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

      # Production security
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_CONTENT_TYPE_NOSNIFF
        value: "True"

      # Existing WhatsApp integration — secrets stay in Render
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: ULTRAMSG_INSTANCE_ID
        sync: false

databases:
  - name: hoovale_db
    databaseName: hoovale_db
    user: hoovale_user
    plan: free
