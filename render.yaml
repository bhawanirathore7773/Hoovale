services:
  - type: web
    name: hoovale
    runtime: python
    rootDir: hoovale_project
    buildCommand: bash render-build.sh
    startCommand: gunicorn hoovale.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DATABASE_URL
        fromDatabase:
          name: hoovale_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "hoovale@outlook.com"
      - key: ADMIN_RESET_PHONE
        sync: false
      - key: ADMIN_RESET_USERNAME
        value: "admin"
      - key: EMAIL_HOST
        value: "smtp-mail.outlook.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "hoovale@outlook.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "hoovale@outlook.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_CONTENT_TYPE_NOSNIFF
        value: "True"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hoovale_db
    databaseName: hoovale_db
    user: hoovale_user
    plan: free
